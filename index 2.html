const garland=piece(tea,.05);path('M277 820V643M658 820V652','none',garland,{stroke:'#b49a70','stroke-width':5});path('M277 651Q460 729 658 659','none',garland,{stroke:'#a49876','stroke-width':1.5});for(let i=0;i<11;i++){const x=290+i*35,t=(x-277)/381,y=651+8*t+140*t*(1-t);el('circle',{cx:x,cy:y+5,r:4,class:'string-bulb'},garland);}
const glow=el('ellipse',{cx:485,cy:882,rx:93,ry:45,fill:'url(#signlight)',class:'tea-glow'},document.getElementById('tea-night'));
function clearEffects(){clearTimeout(petalTimer);clearTimeout(teaTimer);document.getElementById('petals').replaceChildren();tea.classList.remove('tea-boiling');}
function setEvent(next){clearEffects();eventMode=next;document.body.classList.toggle('tea',next==='tea');wedding.classList.toggle('active',next==='wedding');tea.classList.toggle('active',next==='tea');document.getElementById('tea-night').style.display=next==='tea'?'':'none';document.querySelectorAll('[data-event]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.event===next)));}
document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>setEvent(eventMode===b.dataset.event?'none':b.dataset.event)));
function pampas(){const patch=document.getElementById('pampas-patch');patch.classList.remove('shaking');void patch.getBoundingClientRect();patch.classList.add('shaking');const layer=document.getElementById('floating-seeds');layer.replaceChildren();clearTimeout(seedTimer);if(!reduced)for(let i=0;i<7;i++)el('ellipse',{cx:965+random()*80,cy:660+random()*35,rx:2,ry:5,class:'floating-seed',style:`animation-delay:${i*.12}s`},layer);seedTimer=setTimeout(()=>{layer.replaceChildren();patch.classList.remove('shaking');},6200);}
interact(document.getElementById('pampas-patch'),'蒲苇',pampas);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelSequence();clearEffects();}});
setEvent('none');

// Background foliage is an illustrated atmosphere, not extra venue buildings.
const distant=document.getElementById('distant-land');
for(let i=0;i<18;i++){const x=20+i*80,y=580+Math.sin(i*1.7)*28,h=60+(i%4)*11;const tree=el('g',{opacity:.42},distant);el('path',{d:`M${x} ${y+20}V${y+70}`,stroke:'#a1b397','stroke-width':5},tree);el('ellipse',{cx:x,cy:y-h*.5,rx:38,ry:h,fill:'#b2c3a6'},tree);el('ellipse',{cx:x-22,cy:y-h*.28,rx:27,ry:h*.7,fill:'#becbb0'},tree);el('ellipse',{cx:x+22,cy:y-h*.32,rx:25,ry:h*.65,fill:'#acbea1'},tree);}
const demoButton=document.getElementById('demo');let demoTimers=[],demoRunning=false;
function stopDemo(){demoTimers.forEach(clearTimeout);demoTimers=[];demoRunning=false;document.body.classList.remove('demo-running');demoButton.setAttribute('aria-pressed','false');demoButton.setAttribute('aria-label','自动演示');}
function resetManor(){cancelSequence();clearEffects();clearTimeout(seedTimer);windows.forEach(w=>{w.classList.remove('lit');w.setAttribute('aria-pressed','false');w.setAttribute('aria-label','点亮这扇窗户');});document.getElementById('floating-seeds').replaceChildren();document.getElementById('pampas-patch').classList.remove('shaking');setMode('day');setEvent('none');updateLights();}
function startDemo(){stopDemo();resetManor();demoRunning=true;document.body.classList.add('demo-running');demoButton.setAttribute('aria-pressed','true');demoButton.setAttribute('aria-label','暂停演示');const cue=(ms,fn)=>demoTimers.push(setTimeout(fn,ms));cue(1800,()=>setEvent('wedding'));cue(5600,petals);cue(9500,()=>setMode('dusk'));cue(13200,()=>setEvent('tea'));cue(15700,boil);cue(19500,()=>{setMode('night');lightButton.click();});cue(24500,stopDemo);}
demoButton.addEventListener('click',()=>{if(demoRunning){stopDemo();cancelSequence();clearEffects();}else startDemo();});
// A direct choice always takes control back from the film sequence.
document.querySelector('.toolbar').addEventListener('click',e=>{if(e.target.closest('#demo'))return;if(e.isTrusted&&e.target.closest('button'))stopDemo();},true);
document.getElementById('reset').addEventListener('click',()=>{stopDemo();resetManor();});document.addEventListener('pointerdown',e=>{if(demoRunning&&e.target.closest('.interactive-prop,.window')){stopDemo();cancelSequence();clearEffects();}},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopDemo();});
const finePointer=matchMedia('(hover: hover) and (pointer: fine)');let pointerFrame=0,pointerX=0,pointerY=0;
function moveWorld(){document.documentElement.style.setProperty('--world-x',pointerX+'px');document.documentElement.style.setProperty('--world-y',pointerY+'px');pointerFrame=0;}
document.addEventListener('pointermove',e=>{if(reduced||!finePointer.matches||e.pointerType!=='mouse')return;pointerX=(e.clientX/innerWidth-.5)*9;pointerY=(e.clientY/innerHeight-.5)*6;if(!pointerFrame)pointerFrame=requestAnimationFrame(moveWorld);},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{pointerX=0;pointerY=0;if(!pointerFrame)pointerFrame=requestAnimationFrame(moveWorld);});

</script>

<script>
/* 竖屏适配：按舞台实际宽高比扩展 viewBox，把持续草坪的下段显示出来，草地直接铺到屏幕底 */
(function(){
  var svg = document.getElementById('scene');
  var stage = svg && svg.closest('.stage');
  if(!stage) return;
  function fit(){
    var w = stage.clientWidth, h = stage.clientHeight;
    if(!w || !h) return;
    var need = h / w * 1300;
    var vbH = Math.max(870, Math.min(need, 1450));
    svg.setAttribute('viewBox', '50 150 1300 ' + Math.round(vbH));
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
})();
</script>
